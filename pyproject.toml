[project]
name = "qcl-negf-api"
version = "0.2.0"
description = "Authenticated web portal for QCL-NEGF workflows managed by AiiDA"
requires-python = ">=3.14,<3.15"
license = "MIT"
readme = "README.md"
dependencies = [
  "aiida-qcl-negf==0.2.0",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/Afonenko-QCL-NEGF/qcl-negf-portal"

[project.scripts]
qcl-negf-api = "qcl_negf_api.main:main"

[dependency-groups]
test = ["pytest>=8.4,<9", "httpx2>=2.12,<3", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcl_negf_api"]

[tool.hatch.build]
artifacts = ["src/qcl_negf_api/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
